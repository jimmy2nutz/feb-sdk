name: Build FEB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build FEB
        run: |
          make all

      - name: Upload FEB binary
        uses: actions/upload-artifact@v4
        with:
          name: flashiibo-feb
          path: "**/*.feb"
          
